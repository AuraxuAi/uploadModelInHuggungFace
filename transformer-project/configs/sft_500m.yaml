# Supervised fine-tuning of the pretrained 500M model, with pretraining data mixed back in ("replay").
#
#   tp-train --config configs/run_sft.yaml --init-from <path to ckpt_final.pt>
#
# * The model section MUST match the pretraining run exactly (it is loaded from its checkpoint).
# * Pairs file: scripts/build_sft_data.py. Loss is computed on the RESPONSE tokens only, plus the
#   end-of-text token at the end of each response (that is what teaches it to stop).
# * replay_fraction 0.25 = one pretraining chunk (loss on every token) for every 3 fine-tuning pairs.
# * Learning rate is ~10x below the pretraining peak: fine-tuning should nudge the model, not rewrite it.
# * max_steps is set by the notebook from the number of examples and the epochs you choose.

model:
  vocab_size: 32000      # must match the tokenizer you train on the new mix
  context_len: 2048      # 512 is too short for code at this scale
  n_layers: 26
  n_heads: 20
  n_kv_heads: 5
  d_model: 1280
  d_ff_mult: 4.0         # NOTE: SwiGLUFFN uses hidden = (2/3) * d_ff_mult * d_model, so 4.0
                         # gives the standard ~8/3 * d_model. (The old 2.67 shrank it twice.)
  dropout: 0.0           # ~1 epoch over 20B tokens: dropout only slows learning here
  attn_dropout: 0.0
  rope_base: 10000
  norm_eps: 1.0e-5
  tie_weights: true

data:
  train_files:
    - "artifacts/sft/sft_pairs.jsonl"
  token_dtype: uint16                  # dtype of the replay corpus .bin
  replay_corpus: artifacts/mix_20b/corpus.bin
  replay_fraction: 0.25
  val_fraction: 0.01                   # last 1% of the (shuffled) pairs = validation
  tokenizer_path: artifacts/tokenizer_20b_32k.json
  tokenizer_vocab_size: 32000
  cache_dir: artifacts/cache_sft

train:
  output_dir: artifacts/run_sft_500m
  seed: 42
  batch_size: 8                        # micro-batch of 8 sequences x 2048 tokens (padded)
  grad_accum: 4                        # 32 sequences per optimizer step
  max_steps: 4500                      # placeholder; the notebook computes it from your data
  warmup_steps: 100
  eval_every: 250
  save_every: 250
  log_every: 10
  lr: 3.0e-5
  lr_min: 3.0e-6
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  amp_dtype: bf16
  use_amp: true
  num_workers: 4
  use_wandb: false
  keep_last_n_checkpoints: 2
