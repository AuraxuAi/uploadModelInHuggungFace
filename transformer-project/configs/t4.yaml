# Preset for a single T4 GPU (e.g. free-tier Colab, 15GB VRAM).
# ~14M parameters, trains in roughly 30 minutes on TinyStories-scale data.
model:
  vocab_size: 32000
  context_len: 512
  n_layers: 6
  n_heads: 8
  n_kv_heads: 2
  d_model: 512
  d_ff_mult: 4.0
  dropout: 0.1
  attn_dropout: 0.05
  rope_base: 10000
  norm_eps: 1.0e-5
  tie_weights: true

data:
  train_files: []                 # fill in local file paths, OR:
  hf_dataset_name: roneneldan/TinyStories
  hf_dataset_split: train
  hf_text_column: text
  hf_max_samples: 100000
  val_fraction: 0.05
  tokenizer_path: artifacts/tokenizer.json
  tokenizer_vocab_size: 32000
  cache_dir: artifacts/cache

train:
  output_dir: artifacts/run_t4
  seed: 42
  batch_size: 16
  grad_accum: 4
  max_steps: 10000
  warmup_steps: 200
  eval_every: 500
  save_every: 500
  log_every: 20
  lr: 3.0e-4
  lr_min: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  amp_dtype: fp16
  use_amp: true
  num_workers: 2
  use_wandb: false
  keep_last_n_checkpoints: 3
