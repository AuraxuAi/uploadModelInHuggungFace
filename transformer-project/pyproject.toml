[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-project"
version = "0.1.0"
description = "A from-scratch decoder-only transformer (GQA + RoPE + SwiGLU + RMSNorm) with a training and inference pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
    "torch>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "tokenizers>=0.19.1,<1.0.0",
    "datasets>=2.19.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.66.0,<5.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17.0,<0.18.0"]
dist = ["accelerate>=0.30.0,<0.31.0"]
hf = ["transformers>=4.41.0,<5.0.0", "huggingface_hub>=0.23.0,<0.24.0"]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<0.5.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
tp-train = "transformer_project.cli:train_main"
tp-generate = "transformer_project.cli:generate_main"
tp-train-tokenizer = "transformer_project.cli:tokenizer_main"
tp-export-hf = "transformer_project.cli:export_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
